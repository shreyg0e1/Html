<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Green 3D Earth Globe</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    #globeViz {
      width: 100%;
      height: 90vh;
      cursor: grab;
    }

    .region-buttons {
      width: 100%;
      padding: 10px;
      background: #000;
      text-align: center;
    }

    .region-buttons button {
      margin: 5px;
      padding: 8px 16px;
      border: 2px solid #00ffcc;
      background: #012f26;
      color: #00ffcc;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .region-buttons button:hover {
      background: #00ffcc;
      color: #000;
    }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <div class="region-buttons">
    🌍 
    <button onclick="goToRegion('India')">India</button>
    <button onclick="goToRegion('Southeast Asia')">South East Asia</button>
    <button onclick="goToRegion('China')">China</button>
    <button onclick="goToRegion('USA')">USA</button>
    <button onclick="goToRegion('Europe')">Europe</button>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/three@0.145.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <script>
    const regions = [
      { lat: 20.5937, lng: 78.9629, name: 'India' },
      { lat: 15.8700, lng: 100.9925, name: 'Southeast Asia' },
      { lat: 35.8617, lng: 104.1954, name: 'China' },
      { lat: 37.0902, lng: -95.7129, name: 'USA' },
      { lat: 54.5260, lng: 15.2551, name: 'Europe' }
    ];

    const globe = Globe()(document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-green.jpg')  // ✅ Green earth texture
      .backgroundColor('#000000')
      .pointOfView({ lat: 20, lng: 10, altitude: 2 }, 1000)
      .pointsData(regions)
      .pointLat('lat')
      .pointLng('lng')
      .pointColor(() => '#00ffcc')
      .pointAltitude(0.02)
      .pointRadius(0.4)
      .labelsData(regions)
      .labelLat('lat')
      .labelLng('lng')
      .labelText('name')
      .labelColor(() => '#ffee88')
      .labelSize(1.2)
      .labelDotRadius(0.4)
      .labelAltitude(0.05);

    function goToRegion(name) {
      const region = regions.find(r => r.name === name);
      if (region) {
        globe.pointOfView({ lat: region.lat, lng: region.lng, altitude: 1.5 }, 1200);
      }
    }

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.3;
    globe.controls().enableZoom = true;
    globe.controls().enableDamping = true;
  </script>
</body>
</html>
