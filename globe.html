<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive 3D Globe</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at center, #012118, #000);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #globeViz {
      width: 100%;
      height: 90vh;
      cursor: grab;
    }

    .info-box {
      position: absolute;
      padding: 12px 20px;
      background: rgba(30, 30, 30, 0.85);
      color: #ffffaa;
      font-size: 16px;
      border-radius: 8px;
      display: none;
      pointer-events: none;
      z-index: 10;
    }

    .region-buttons {
      width: 100%;
      padding: 10px;
      background: #000;
      text-align: center;
      z-index: 20;
    }

    .region-buttons button {
      margin: 5px 10px;
      padding: 8px 18px;
      font-size: 15px;
      background: #012f26;
      border: 2px solid #00ffcc;
      color: #00ffcc;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .region-buttons button:hover {
      background-color: #00ffcc;
      color: #000;
      box-shadow: 0 0 10px #00ffcc;
    }

    @media (max-width: 600px) {
      .region-buttons {
        font-size: 14px;
        flex-wrap: wrap;
        padding: 6px;
      }

      .region-buttons button {
        font-size: 13px;
        margin: 4px;
        padding: 6px 14px;
      }
    }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <div class="region-buttons">
    🌍 
    <button onclick="goToRegion('India')">India</button>
    <button onclick="goToRegion('Southeast Asia')">South East Asia</button>
    <button onclick="goToRegion('China')">China</button>
    <button onclick="goToRegion('USA')">USA</button>
    <button onclick="goToRegion('Europe')">Europe</button>
  </div>

  <div id="info" class="info-box"></div>

  <!-- Required Libraries -->
  <script src="https://unpkg.com/three@0.145.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <script>
    const regions = [
      { lat: 20.5937, lng: 78.9629, name: 'India' },
      { lat: 15.8700, lng: 100.9925, name: 'Southeast Asia' },
      { lat: 35.8617, lng: 104.1954, name: 'China' },
      { lat: 37.0902, lng: -95.7129, name: 'USA' },
      { lat: 54.5260, lng: 15.2551, name: 'Europe' }
    ];

    const globeContainer = document.getElementById('globeViz');
    const infoEl = document.getElementById('info');

    const globe = Globe()(globeContainer)
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg') // yha pe tere dost ke code me se vo green earth daal de bs
    
      .backgroundColor('rgba(0,0,0,0)')
      .pointOfView({ lat: 20, lng: 10, altitude: 2 }, 1000)
      .pointsData(regions)
      .pointLat('lat')
      .pointLng('lng')
      .pointColor(() => '#00ffcc')
      .pointAltitude(0.02)
      .pointRadius(0.4)
      .onPointClick(point => {
        goToRegion(point.name);
      })
      .labelsData(regions)
      .labelLat('lat')
      .labelLng('lng')
      .labelText('name')
      .labelColor(() => '#ffee88')
      .labelSize(1.2)
      .labelDotRadius(0.4)
      .labelAltitude(0.05);

    function goToRegion(name) {
      const region = regions.find(r => r.name === name);
      if (region) {
        globe.pointOfView({
          lat: region.lat,
          lng: region.lng,
          altitude: 1.5
        }, 1200);
      }
    }

    // Auto-rotate
    (function animate() {
      globe.controls().autoRotate = true;
      globe.controls().autoRotateSpeed = 0.4;
      globe.controls().enableZoom = true;
      globe.controls().enableDamping = true;
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
